<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Siv3D App</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
    #canvas { display: block; margin: 0 auto; outline: none; }
    #status {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #ccc; font: 16px sans-serif; pointer-events: none;
    }
  </style>
</head>
<body>
  <!-- SDL3 は既定で #canvas に描画する。キー入力を受け取るため tabindex を付ける -->
  <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
  <div id="status">Loading...</div>
  <script>
    var statusElement = document.getElementById('status');
    var Module = {
      canvas: document.getElementById('canvas'),
      print: (text) => console.log(text),
      printErr: (text) => console.error(text),
      setStatus: (text) => {
        statusElement.textContent = text;
        statusElement.style.display = text ? 'flex' : 'none';
      },
      monitorRunDependencies: (left) => {
        if (left === 0) Module.setStatus('');
      },
    };
    window.addEventListener('error', () => Module.setStatus('Error (see the console)'));
    if (!crossOriginIsolated) {
      console.warn('This page is not cross-origin isolated. Serve it with COOP/COEP headers (see serve.py).');
    }
    document.getElementById('canvas').addEventListener('click', (e) => e.target.focus());
  </script>
  {{{ SCRIPT }}}
</body>
</html>
